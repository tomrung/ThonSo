<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="6" y="6" width="180" height="180" rx="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Smart Digital Network Web Lines -->
  <path d="M40 96 L96 40 L152 96 L96 152 Z" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="40" cy="96" r="4" fill="#38bdf8"/>
  <circle cx="96" cy="40" r="4" fill="#38bdf8"/>
  <circle cx="152" cy="96" r="4" fill="#38bdf8"/>
  <circle cx="96" cy="152" r="4" fill="#38bdf8"/>

  <!-- Center Shield of An Trach -->
  <path d="M96 48 C124 48 136 60 136 84 C136 122 96 142 96 142 C96 142 56 122 56 84 C56 60 68 48 96 48 Z" fill="rgba(15,23,42,0.6)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Golden Star of Vietnam -->
  <polygon points="96,62 101,75 115,75 104,83 108,97 96,89 84,97 88,83 77,75 91,75" fill="url(#goldGrad)"/>

  <!-- Wheat Rice Stalks (Nong Nghiep An Trach) -->
  <path d="M78 116 C84 106 90 98 96 92 C102 98 108 106 114 116" fill="none" stroke="url(#leafGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="108" r="3" fill="#34d399"/>
  <circle cx="106" cy="108" r="3" fill="#34d399"/>
  <circle cx="96" cy="96" r="3.5" fill="#34d399"/>

  <!-- Village Typography -->
  <text x="96" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">AN TRẠCH SỐ</text>
</svg>
