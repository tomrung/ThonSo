<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Square for Safe Masking -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)"/>

  <!-- Safe Area Inner Content (Scale 0.7) -->
  <g transform="translate(76.8, 76.8) scale(0.7)">
    <!-- Center Shield of An Trach -->
    <path d="M256 100 C340 100 376 135 376 210 C376 330 256 395 256 395 C256 395 136 330 136 210 C136 135 172 100 256 100 Z" fill="rgba(15,23,42,0.85)" stroke="url(#goldMaskGrad)" stroke-width="10"/>

    <!-- Golden Star of Vietnam -->
    <polygon points="256,135 271,178 316,178 280,205 294,248 256,222 218,248 232,205 196,178 241,178" fill="url(#goldMaskGrad)"/>

    <!-- Wheat Rice Stalks -->
    <circle cx="220" cy="285" r="10" fill="#34d399"/>
    <circle cx="292" cy="285" r="10" fill="#34d399"/>
    <circle cx="256" cy="255" r="11" fill="#34d399"/>

    <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">AN TRẠCH SỐ</text>
  </g>
</svg>
